name: 养基宝基金持仓
description: 在 Egern 小组件中显示全部可用基金持仓、当日涨幅金额与涨跌幅、开市状态和更新时间。
author: YikR
homepage: https://github.com/YikR/egern-yjb-widget
manual: https://github.com/YikR/egern-yjb-widget#readme

env_schema:
  YJB_TOKEN:
    name: 养基宝登录令牌
    description: 只在 Egern 的本机模块 Env 中填写，不要提交到 GitHub 或发送到聊天。
  YJB_ACCOUNT_ID:
    name: 基金账户 ID（可选）
    description: 留空时读取账号返回的第一个基金账户。
  YJB_POLICY:
    name: 请求策略组（可选）
    description: 填写 Egern 中已有的策略组名称；留空时使用默认策略。
  YJB_SHOW_DAILY_CHANGE_AMOUNT:
    name: 显示当日涨幅金额（0/1）
    description: 设为 1 显示当日涨幅金额，设为 0 隐藏；默认 1。
  YJB_SHOW_DAILY_CHANGE_PCT:
    name: 显示当日涨幅（0/1）
    description: 设为 1 显示当日涨幅百分比，设为 0 隐藏；默认 1。
  YJB_MAX_FIELDS:
    name: 最多显示字段数（0-2）
    description: 每只基金最多显示的涨幅字段数，不含基金名称；0 表示不显示金额和百分比，默认 2。

scriptings:
  - generic:
      name: 养基宝持仓
      script_url: https://raw.githubusercontent.com/YikR/egern-yjb-widget/main/yjb-fund-widget.js?v=20261109-2
      update_interval: 86400
      timeout: 20

widgets:
  - name: 养基宝持仓
    script_name: 养基宝持仓
    env:
      # 养基宝新 App API 的固定签名常量；账号 Token 不写入远程模块。
      YJB_SIGNING_SECRET: "Zk0w9mX7IKFGo5qp5jyDwJKnU7ZJZZJwGhs5myg4vlv4lKEHFKxGe6jlb84KOLkx"
